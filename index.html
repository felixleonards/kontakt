<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Felix Leonards</title>
  <meta name="description" content="Kontakt von Felix Leonards, Universität St.Gallen">
  <style>
    :root {
      --bg: #f4f6f4;
      --card: #ffffff;
      --text: #1b1f1c;
      --muted: #5c665f;
      --line: #dfe5e0;
      --accent: #00802f;
      --accent-text: #ffffff;
      --secondary: #eef4ef;
      --secondary-text: #0d5c25;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111412;
        --card: #1a1f1c;
        --text: #eef2ef;
        --muted: #a3ada6;
        --line: #2c3430;
        --accent: #00802f;
        --accent-text: #ffffff;
        --secondary: #232a26;
        --secondary-text: #bfe5cb;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px 24px 24px;
      text-align: center;
    }
    .avatar {
      width: 84px;
      height: 84px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -0.2px;
    }
    .org {
      margin: 6px 0 28px;
      color: var(--muted);
      font-size: 16px;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 54px;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s ease, filter 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn svg { width: 20px; height: 20px; flex: none; }
    .primary { background: var(--accent); color: var(--accent-text); }
    .primary:hover { filter: brightness(1.08); }
    .secondary { background: var(--secondary); color: var(--secondary-text); }
    .secondary:hover { filter: brightness(0.97); }
    .mail {
      margin: 20px 0 0;
      font-size: 15px;
      color: var(--muted);
      word-break: break-all;
    }
    .mail a { color: inherit; }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">FL</div>
    <h1>Felix Leonards</h1>
    <p class="org" data-de="Universität St.Gallen" data-en="University of St.Gallen">Universität St.Gallen</p>

    <div class="buttons">
      <a class="btn primary" href="kontakt.vcf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"/><path d="M19 8v6M16 11h6"/></svg>
        <span data-de="Kontakt speichern" data-en="Save contact">Kontakt speichern</span>
      </a>
      <a class="btn secondary" href="https://www.linkedin.com/in/felix-leonards/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/></svg>
        <span data-de="LinkedIn-Profil" data-en="LinkedIn profile">LinkedIn-Profil</span>
      </a>
      <a class="btn secondary" href="mailto:felix.leonards@unisg.ch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <span data-de="E-Mail schreiben" data-en="Send email">E-Mail schreiben</span>
      </a>
    </div>

    <p class="mail"><a href="mailto:felix.leonards@unisg.ch">felix.leonards@unisg.ch</a></p>
  </main>

  <script>
    (function () {
      var lang = (navigator.language || "de").toLowerCase();
      if (lang.indexOf("de") === 0) return;
      document.documentElement.lang = "en";
      var nodes = document.querySelectorAll("[data-en]");
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].textContent = nodes[i].getAttribute("data-en");
      }
    })();
  </script>
</body>
</html>
